name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Also run the LLM eval (uses API credits)"
        type: boolean
        default: false

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bankdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: bankdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt numpy pandas
      - name: Generate a 20,000-row sample and load it
        run: |
          python data/generate_loan_portfolio.py --rows 20000 --out data/loan_portfolio
          psql -d bankdb -f db/01_schema.sql
          psql -d bankdb -c "\copy loan_portfolio FROM 'data/loan_portfolio.csv' WITH (FORMAT csv, HEADER true, NULL '')"
          bash db/03_readonly_role.sh
      - name: Unit and integration tests
        working-directory: backend
        run: python -m pytest
      - name: LLM eval (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_eval }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: gpt-4.1-mini
        run: python eval/run_eval.py --min-accuracy 80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
